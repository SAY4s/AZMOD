<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمود | ورود به حساب کاربری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase SDK (compat build — simplest to use without a bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          charcoal: { DEFAULT:'#4E4E4E', deep:'#333333', dark:'#242424', panel:'#3A3A3A' },
          gold: { DEFAULT:'#E9D0A9', light:'#F4E8D3', dim:'#C9AD82' }
        },
        fontFamily: { sans: ['Vazirmatn','sans-serif'] }
      }
    }
  }
</script>
<style>
  html { scroll-behavior:smooth; }
  body { font-family:'Vazirmatn', sans-serif; background:#242424; }
  ::selection { background:#E9D0A9; color:#242424; }
  .fa-num { font-feature-settings:"ss01"; }

  .glass {
    background: linear-gradient(145deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015));
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(233,208,169,0.14);
  }
  .divider-gold { height:1px; background: linear-gradient(90deg, transparent, #E9D0A9 50%, transparent); }

  .btn-gold { background:#E9D0A9; color:#242424; transition:all .25s cubic-bezier(.2,.8,.2,1); }
  .btn-gold:hover { background:#F4E8D3; box-shadow:0 8px 24px -6px rgba(233,208,169,.5); transform:translateY(-1px); }
  .btn-gold:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }

  input {
    background: rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.1); color:#fff;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  input::placeholder { color: rgba(255,255,255,.35); }
  input:focus { outline:none; border-color:#E9D0A9; box-shadow:0 0 0 3px rgba(233,208,169,.14); }

  .seal svg{display:block;}

  .mode-tab { transition: all .25s ease; }
  .mode-tab.active { color:#242424; background:#E9D0A9; }
  .mode-tab:not(.active) { color:rgba(255,255,255,.55); }

  .spinner {
    width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(36,36,36,.25); border-top-color:#242424;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .grain {
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(233,208,169,0.05) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events:none;
  }
</style>
</head>
<body class="text-white antialiased min-h-screen flex items-center justify-center px-5 py-10">

<div class="absolute inset-0 -z-10 bg-gradient-to-b from-charcoal-dark via-[#333333] to-charcoal-dark"></div>
<div class="grain -z-10"></div>
<div class="absolute -top-40 -left-40 w-[30rem] h-[30rem] rounded-full bg-gold/10 blur-[120px] -z-10"></div>

<div class="w-full max-w-md">

  <div class="flex flex-col items-center mb-8">
    <a href="index.html" class="mb-3">
      <img src="logo.png" alt="آزمود" class="h-14 w-auto">
    </a>
  </div>

  <div class="glass rounded-3xl p-7 sm:p-9">

    <!-- mode switch -->
    <div class="flex rounded-xl bg-black/25 p-1 mb-7 text-sm font-bold">
      <button id="tabLogin" onclick="switchMode('login')" class="mode-tab active flex-1 py-2.5 rounded-lg">ورود</button>
      <button id="tabSignup" onclick="switchMode('signup')" class="mode-tab flex-1 py-2.5 rounded-lg">ثبت‌نام</button>
    </div>

    <!-- config warning (shown only if firebaseConfig wasn't filled in) -->
    <div id="configWarning" class="hidden mb-5 text-xs rounded-lg p-3 bg-red-400/10 border border-red-400/25 text-red-200 leading-6">
      کلیدهای Firebase هنوز در کد جایگذاری نشده‌اند. ابتدا بخش <code class="font-mono">CONFIG</code> در انتهای این فایل را با اطلاعات پروژه‌ی Firebase خودتان پر کنید.
    </div>

    <form id="authForm" onsubmit="return false;">
      <div id="signupNameField" class="hidden mb-4">
        <label class="block text-xs text-white/50 mb-1.5">نام و نام خانوادگی</label>
        <input id="nameInput" type="text" placeholder="نام شما" class="w-full rounded-lg px-3 py-2.5 text-sm">
      </div>

      <div class="mb-4">
        <label class="block text-xs text-white/50 mb-1.5">ایمیل</label>
        <input id="emailInput" type="email" placeholder="example@mail.com" class="w-full rounded-lg px-3 py-2.5 text-sm" dir="ltr">
      </div>

      <div class="mb-2">
        <label class="block text-xs text-white/50 mb-1.5">رمز عبور</label>
        <input id="passwordInput" type="password" placeholder="حداقل ۶ کاراکتر" class="w-full rounded-lg px-3 py-2.5 text-sm" dir="ltr">
      </div>

      <div id="signupConfirmField" class="hidden mt-4">
        <label class="block text-xs text-white/50 mb-1.5">تکرار رمز عبور</label>
        <input id="passwordConfirmInput" type="password" placeholder="رمز عبور را دوباره وارد کنید" class="w-full rounded-lg px-3 py-2.5 text-sm" dir="ltr">
      </div>

      <p id="formError" class="hidden text-xs text-red-300 mt-4 leading-6"></p>

      <button id="submitBtn" onclick="handleSubmit()" class="btn-gold w-full font-bold py-3 rounded-xl mt-6 flex items-center justify-center gap-2">
        <span id="submitLabel">ورود به حساب کاربری</span>
      </button>
    </form>

    <p class="text-center text-white/35 text-[11px] mt-6 leading-6">
      با ورود یا ثبت‌نام، یک حساب کاربری اختصاصی برای ساخت و مدیریت آزمون‌های خودتان دارید.
    </p>
  </div>

  <p class="text-center text-white/30 text-xs mt-6">
    <a href="index.html" class="hover:text-gold transition-colors">بازگشت به صفحه اصلی</a>
  </p>
</div>

<script>
/* ============================================================
   CONFIG — کلیدهای پروژه‌ی Firebase خودتان را اینجا جایگذاری کنید
   (از Firebase Console → Project Settings → Your apps کپی کنید)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCykNFE6DfzG-US7aofSWSGtXMIK3Wz1O0",
  authDomain: "azmood-2f0cc.firebaseapp.com",
  projectId: "azmood-2f0cc",
  storageBucket: "azmood-2f0cc.firebasestorage.app",
  messagingSenderId: "1004258048783",
  appId: "1:1004258048783:web:1eb3a8565d1c90bb0cdc7a"
};

let configReady = firebaseConfig.apiKey !== "YOUR_API_KEY";
if(!configReady){
  document.getElementById('configWarning').classList.remove('hidden');
} else {
  firebase.initializeApp(firebaseConfig);
}

/* ============================================================
   UI MODE (login / signup)
   ============================================================ */
let mode = 'login';
function switchMode(m){
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m==='login');
  document.getElementById('tabSignup').classList.toggle('active', m==='signup');
  document.getElementById('signupNameField').classList.toggle('hidden', m!=='signup');
  document.getElementById('signupConfirmField').classList.toggle('hidden', m!=='signup');
  document.getElementById('submitLabel').textContent = m==='login' ? 'ورود به حساب کاربری' : 'ساخت حساب کاربری';
  hideError();
}

function showError(msg){
  const el = document.getElementById('formError');
  el.textContent = msg;
  el.classList.remove('hidden');
}
function hideError(){
  document.getElementById('formError').classList.add('hidden');
}
function setLoading(loading){
  const btn = document.getElementById('submitBtn');
  btn.disabled = loading;
  document.getElementById('submitLabel').innerHTML = loading
    ? '<span class="spinner"></span>'
    : (mode==='login' ? 'ورود به حساب کاربری' : 'ساخت حساب کاربری');
}

/* translate Firebase's English error codes into clear Persian messages */
function translateAuthError(code){
  const map = {
    'auth/invalid-email': 'فرمت ایمیل وارد شده صحیح نیست.',
    'auth/user-disabled': 'این حساب کاربری غیرفعال شده است.',
    'auth/user-not-found': 'حسابی با این ایمیل یافت نشد. ابتدا ثبت‌نام کنید.',
    'auth/wrong-password': 'رمز عبور وارد شده اشتباه است.',
    'auth/invalid-credential': 'ایمیل یا رمز عبور اشتباه است.',
    'auth/email-already-in-use': 'این ایمیل قبلاً ثبت‌نام کرده است. از تب «ورود» استفاده کنید.',
    'auth/weak-password': 'رمز عبور باید حداقل ۶ کاراکتر باشد.',
    'auth/too-many-requests': 'تعداد تلاش‌های ناموفق زیاد بوده؛ کمی صبر کنید و دوباره امتحان کنید.',
    'auth/network-request-failed': 'خطا در برقراری ارتباط با سرور. اتصال اینترنت را بررسی کنید.'
  };
  return map[code] || 'خطایی رخ داد. لطفاً دوباره تلاش کنید.';
}

/* preserve plan/users query params (coming from the pricing page) through to the dashboard */
function dashboardRedirectUrl(){
  const params = new URLSearchParams(window.location.search);
  const qs = params.toString();
  return 'dashboard.html' + (qs ? ('?' + qs) : '');
}

function handleSubmit(){
  hideError();
  if(!configReady){
    showError('ابتدا کلیدهای Firebase را در کد جایگذاری کنید.');
    return;
  }
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;

  if(!email || !password){
    showError('لطفاً ایمیل و رمز عبور را وارد کنید.');
    return;
  }

  if(mode === 'signup'){
    const name = document.getElementById('nameInput').value.trim();
    const confirm = document.getElementById('passwordConfirmInput').value;
    if(!name){ showError('لطفاً نام خود را وارد کنید.'); return; }
    if(password.length < 6){ showError('رمز عبور باید حداقل ۶ کاراکتر باشد.'); return; }
    if(password !== confirm){ showError('رمز عبور و تکرار آن یکسان نیستند.'); return; }

    setLoading(true);
    firebase.auth().createUserWithEmailAndPassword(email, password)
      .then(cred => cred.user.updateProfile({ displayName: name }))
      .then(() => { window.location.href = dashboardRedirectUrl(); })
      .catch(err => { setLoading(false); showError(translateAuthError(err.code)); });

  } else {
    setLoading(true);
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(() => { window.location.href = dashboardRedirectUrl(); })
      .catch(err => { setLoading(false); showError(translateAuthError(err.code)); });
  }
}

/* if already logged in, skip straight to the dashboard */
if(configReady){
  firebase.auth().onAuthStateChanged(user=>{
    if(user) window.location.href = dashboardRedirectUrl();
  });
}

document.getElementById('passwordInput').addEventListener('keydown', e=>{ if(e.key==='Enter') handleSubmit(); });
document.getElementById('passwordConfirmInput').addEventListener('keydown', e=>{ if(e.key==='Enter') handleSubmit(); });
</script>
</body>
</html>
